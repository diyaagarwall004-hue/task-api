<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Section 1: Login / Signup -->
  <div id="auth-section" class="card">
    <h1>Task Manager</h1>

    <form id="login-form">
      <h2>Login</h2>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p>Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
    </form>

    <form id="signup-form" class="hidden">
      <h2>Sign Up</h2>
      <input type="text" id="signup-name" placeholder="Name" required>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
      <p>Already have an account? <a href="#" id="show-login">Login</a></p>
    </form>

    <p id="auth-message" class="message"></p>
  </div>

 <!-- Section 2: Dashboard (login ke baad dikhega) -->
  <div id="dashboard-section" class="card hidden">
    <div class="header">
      <h2>Welcome, <span id="user-name"></span></h2>
      <div class="header-actions">
        <a href="admin.html" class="admin-link hidden" id="admin-link">Admin View</a>
        <button id="logout-btn">Logout</button>
      </div>
    </div>

    <form id="task-form">
      <input type="text" id="task-title" placeholder="Task title" required>
      <input type="text" id="task-description" placeholder="Description (optional)">
      <button type="submit">Add Task</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
