<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card admin-card">
    <div class="header">
      <h2>Admin Panel</h2>
      <a href="index.html" class="back-link">← Back to my tasks</a>
    </div>

    <p id="admin-summary" class="message"></p>

    <form id="assign-all-form" class="assign-form assign-all hidden">
      <input type="text" id="assign-all-title" placeholder="Task title for everyone" required>
      <input type="text" id="assign-all-desc" placeholder="Description (optional)">
      <button type="submit">Assign to all users</button>
      <span id="assign-all-note" class="inline-note"></span>
    </form>

    <div id="users-container"></div>

    <div class="pagination">
      <button id="prev-btn">← Previous</button>
      <span id="page-info"></span>
      <button id="next-btn">Next →</button>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
